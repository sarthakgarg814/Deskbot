# DeskBot bootstrap + seed config.
#
# Two parts:
#   runtime:  low-level config read BEFORE the DB exists (paths, ports, backend).
#   settings: seed rows for the `settings` table — the dashboard-editable tunables.
#             On first boot these are inserted; existing keys are left untouched so
#             user edits from the dashboard are never overwritten.

runtime:
  hardware_backend: mock        # mock | real   (Milestone 1 = mock; the Pi uses real)
  bus_backend: inprocess        # inprocess | redis  (laptop=inprocess; Pi w/ vision=redis)
  redis_url: redis://localhost:6379/0
  preview_port: 8090            # vision MJPEG preview port (only streams when enabled)
  servo_pan_pin: 12             # BCM GPIO for the pan servo signal
  servo_tilt_pin: 13            # BCM GPIO for the tilt servo signal
  db_path: deskbot.db           # relative to repo root
  host: 0.0.0.0
  port: 8000
  log_level: INFO
  # Where the built frontend lands (vite build on laptop -> copied here on the Pi).
  # Resolved relative to the repo root.
  frontend_dist: frontend/dist

settings:
  # --- system ---
  - { key: system.timezone,        value: "UTC",     type: str,   namespace: system }
  - { key: system.hostname,        value: "deskbot", type: str,   namespace: system }

  # --- camera / tracking (CPU knobs — editable live from the dashboard) ---
  - { key: camera.tracking_mode,   value: "smooth",  type: str,   namespace: camera }
  - { key: camera.sensitivity,     value: 0.5,       type: float, namespace: camera }
  - { key: camera.track_fps,       value: 10,        type: int,   namespace: camera }  # fps when present
  - { key: camera.idle_fps,        value: 2,         type: int,   namespace: camera }  # fps when away
  - { key: camera.detect_width,    value: 256,       type: int,   namespace: camera }  # detect downscale px

  # --- servo / pan-tilt (dashboard-tunable, hot-reloaded by the hardware svc) ---
  # Face tracking = position-step: on each vision sample, move by
  # track_gain * error * (FOV/2) toward center, slew there (max_speed), then hold.
  # track_gain <1 damps against camera latency (0.5 = halve the error each frame).
  # Flip the invert flags if a servo moves the WRONG way (camera-on-gimbal usually
  # needs them true). fov_* are the camera's field-of-view in degrees.
  - { key: servo.pan.invert,       value: false,     type: bool,  namespace: servo }
  - { key: servo.tilt.invert,      value: false,     type: bool,  namespace: servo }
  - { key: servo.pan.offset_deg,   value: 0,         type: int,   namespace: servo }
  - { key: servo.tilt.offset_deg,  value: 0,         type: int,   namespace: servo }
  - { key: servo.limit_deg,        value: 80,        type: int,   namespace: servo }  # ± max angle
  - { key: servo.max_speed,        value: 120,       type: int,   namespace: servo }  # deg/sec slew
  - { key: servo.deadzone,         value: 0.04,      type: float, namespace: servo }  # settle threshold
  - { key: servo.recenter_after_s, value: 3.0,       type: float, namespace: servo }  # face lost this long -> home
  - { key: servo.track_gain,       value: 0.5,       type: float, namespace: servo }  # 0.5 = halve error/frame
  - { key: servo.fov_pan,          value: 54.0,      type: float, namespace: servo }  # camera H FOV (deg)
  - { key: servo.fov_tilt,         value: 41.0,      type: float, namespace: servo }  # camera V FOV (deg)

  # --- led ---
  - { key: led.brightness,         value: 0.4,       type: float, namespace: led }
  - { key: led.count,              value: 8,         type: int,   namespace: led }

  # --- voice ---
  - { key: voice.wake_word,        value: "deskbot", type: str,   namespace: voice }
  - { key: voice.language,         value: "en",      type: str,   namespace: voice }
  - { key: voice.confidence_min,   value: 0.6,       type: float, namespace: voice }

  # --- mood ---
  - { key: mood.enabled,           value: true,      type: bool,  namespace: mood }

  # --- camera preview (privacy: off by default; on = MJPEG stream on the LAN) ---
  - { key: camera.preview_enabled, value: false,     type: bool,  namespace: camera }
  - { key: mood.sample_interval_s, value: 5,         type: int,   namespace: mood }
