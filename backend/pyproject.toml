[project]
name = "deskbot-backend"
version = "0.1.0"
description = "DeskBot AI backend — core, common, hardware services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "apscheduler>=3.10",
    "psutil>=5.9",
    "redis>=5.0",
]

[project.optional-dependencies]
# Installed ONLY on the Raspberry Pi for the REAL hardware backend (Milestone 2+).
# Milestone 1 runs on mock hardware and needs NONE of these — install the base
# deps only. NOTE: pigpio was removed in Raspberry Pi OS Trixie; we use lgpio
# (Trixie's native backend) and/or a PCA9685 I2C servo board instead.
# picamera2 / rpi_ws281x are best installed via apt (python3-picamera2,
# python3-rpi-ws281x) rather than pip on Trixie.
pi = [
    "gpiozero>=2.0",
    "lgpio>=0.2",
    "luma.oled>=3.12",
    "adafruit-circuitpython-pca9685>=3.4",  # optional: PCA9685 servo board
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]
# Vision deps for LAPTOP/dev use (OpenCV YuNet detection, D9). On the Pi, install
# system packages instead — `sudo apt install python3-opencv python3-picamera2` —
# and run vision with a --system-site-packages venv (picamera2 is Pi-system-only).
vision = [
    "opencv-python-headless>=4.9",
    "numpy>=1.24",
]

# Auto-discover the service packages (+ their subpackages). Using find with
# include patterns so adding a new top-level service (e.g. voice) needs no edit
# here, while keeping tests/ out of the installed distribution.
[tool.setuptools.packages.find]
where = ["."]
include = ["common*", "core*", "hardware*", "vision*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
